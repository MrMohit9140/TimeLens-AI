services:
  - type: web
    name: timelens-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROVIDER
        value: hf_space
      - key: HF_SPACE
        value: linoyts/qwen-image-2-1-realtime
      - key: HF_TOKEN
        sync: false
      - key: RATE_LIMIT_PER_HOUR
        value: "6"
